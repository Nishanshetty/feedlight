name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

# Cancel an in-progress build when new commits are pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS universal binary
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job is a required check, so it must always report a result:
      # skipping the whole workflow with `paths-ignore` would leave docs-only
      # PRs waiting forever. Instead, PRs that touch nothing but the paths
      # below skip the build steps and pass in seconds. Anything not listed
      # builds, as do pushes to main, tags and manual runs.
      - name: Detect app changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          build=true
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD)
            if [ -n "$changed" ]; then
              build=false
              while IFS= read -r f; do
                case "$f" in
                  docs/*|website/*|brand/*|.claude/*|.github/ISSUE_TEMPLATE/*|*.md|.gitignore|.git-blame-ignore-revs|.prettierignore) ;;
                  *) build=true; echo "App change: $f"; break ;;
                esac
              done <<<"$changed"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "Only docs, website or config changed; skipping the build."

      - name: Install Node.js
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-node@v7
        with:
          # Same floor as the test workflow: Vite 8 needs Node 20.19+/22.x, and
          # the Vitest job already runs on 22.
          node-version: 22
          cache: npm

      - name: Install Rust stable
        if: steps.changes.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        if: steps.changes.outputs.build == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        if: steps.changes.outputs.build == 'true'
        run: npm ci

      # Tag builds only: sign with the Developer ID certificate and notarize
      # with the App Store Connect API key, so the DMG opens without a
      # Gatekeeper warning, and sign the in-app update with the updater key.
      # tauri-action reads these variables; without them (PR and main builds)
      # the app is built unsigned. See docs/RELEASING.md for each secret.
      - name: Load signing credentials
        if: steps.changes.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY API_KEY API_ISSUER API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret APPLE_$name is missing or empty."
              exit 1
            fi
          done
          if [ -z "$UPDATER_KEY" ] || [ -z "$UPDATER_KEY_PASSWORD" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing or empty."
            exit 1
          fi
          # GitHub masks a secret only where its exact value appears. The
          # certificate is rewritten onto one line below, so mask that form too.
          certificate=$(printf '%s' "$CERTIFICATE" | tr -d '\r\n ')
          echo "::add-mask::$certificate"
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s\n' "$API_KEY_P8" > "$key_path"
          {
            # Base64 may arrive wrapped over several lines; Tauri wants one.
            echo "APPLE_CERTIFICATE=$certificate"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
            # Multi-line safe: the key is written as-is between delimiters.
            echo "TAURI_SIGNING_PRIVATE_KEY<<__UPDATER_KEY__"
            printf '%s\n' "$UPDATER_KEY"
            echo "__UPDATER_KEY__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Tauri app (universal binary)
        if: steps.changes.outputs.build == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # Release tags build the full DMG for distribution, plus the signed
          # update (tauri.release.conf.json turns on updater artifacts, which
          # need the private key, so only tag builds can make them). Routine
          # main/PR builds only produce the .app — this skips the flaky
          # bundle_dmg.sh step (AppleScript/hdiutil races on headless runners).
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/')
                && '--target universal-apple-darwin --config src-tauri/tauri.release.conf.json'
                || '--target universal-apple-darwin --bundles app' }}
          # On version tags, publish a GitHub Release with the .dmg attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          releaseName: Feedlight ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for what changed in this release.
          # Pre-release tags (v0.2.2-rc.1) stay drafts: visible only to
          # maintainers, so they never become "Latest", which the website's
          # download button links to.
          releaseDraft: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
          prerelease: false

      - name: Upload .app artifact (non-tag builds)
        if: ${{ steps.changes.outputs.build == 'true' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: Feedlight-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: ignore
          retention-days: 14
