name: Ready to review

# Stage 1 of the PR flow (see CONTRIBUTING.md):
#   - the PR author (or a collaborator) comments `/ready`, or a collaborator
#     adds the `ready to review` label by hand -> the maintainer is requested
#     as a reviewer;
#   - new commits are pushed -> both stage labels come off, because the code
#     they described has changed;
#   - the PR is merged or closed -> both stage labels come off, since it is no
#     longer waiting on anyone.
#
# Security: nothing here checks out or runs PR code. Every step only calls the
# GitHub API, and event values reach the shell through env vars, never inline.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, synchronize, closed]

permissions: {}

concurrency:
  group: ready-to-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  MAINTAINER: Nishanshetty
  REVIEW_LABEL: ready to review
  MERGE_LABEL: ready to merge

jobs:
  ready-command:
    name: Handle /ready comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/ready')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label the PR and request review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          # The first line must be `/ready`, optionally followed by a note
          # (`/ready, addressed everything`), but not `/readying`.
          first_line=${BODY%%$'\n'*}
          first_line=${first_line%$'\r'}
          first_line=$(sed -e 's/^[[:space:]]*//' <<<"$first_line")
          if ! grep -qE '^/ready([^[:alnum:]_-]|$)' <<<"$first_line"; then
            echo "Not a /ready command; ignoring."
            exit 0
          fi

          # The PR author, or anyone with write access to the repo.
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) allowed=1 ;;
            *) [ "$COMMENTER" = "$PR_AUTHOR" ] && allowed=1 || allowed=0 ;;
          esac
          if [ "$allowed" != 1 ]; then
            echo "$COMMENTER is neither the PR author nor a collaborator; ignoring."
            exit 0
          fi

          gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$REVIEW_LABEL" > /dev/null

          # GitHub does not allow requesting a review from the PR's own author.
          if [ "$PR_AUTHOR" != "$MAINTAINER" ]; then
            gh api -X POST "repos/$GH_REPO/pulls/$PR/requested_reviewers" \
              -f "reviewers[]=$MAINTAINER" > /dev/null
          fi

          # A thumbs-up on the comment tells the author it was picked up.
          gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=+1 > /dev/null

  label-added:
    name: Request review for labelled PR
    # A label added by this workflow's own token does not fire `labeled`, so
    # this only runs when a person adds the label by hand.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready to review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from the maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "$MAINTAINER" ]; then
            echo "The maintainer opened this PR; nobody to request."
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/pulls/$PR/requested_reviewers" \
            -f "reviewers[]=$MAINTAINER" > /dev/null

  clear-labels:
    name: Clear stage labels
    # New commits (the code changed) or the PR merged/closed (nothing left to do).
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'synchronize' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove ready labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for label in "$REVIEW_LABEL" "$MERGE_LABEL"; do
            if jq -e --arg l "$label" '.pull_request.labels | any(.name == $l)' \
                 "$GITHUB_EVENT_PATH" > /dev/null; then
              encoded=$(jq -rn --arg l "$label" '$l | @uri')
              gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/$encoded" > /dev/null
              echo "Removed '$label'."
            fi
          done
