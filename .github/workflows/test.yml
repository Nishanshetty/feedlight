name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No job needs more than the checkout. CodeQL flagged the missing block:
# the default GITHUB_TOKEN is far broader than a test run requires.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-guard:
    name: Migration guard
    # Migrations are append-only: users' databases record a checksum of each
    # applied file, so editing, renaming or deleting a shipped one breaks
    # startup for them. New files are fine. See src-tauri/src/migrations.rs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a shipped migration changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA"...HEAD -- src-tauri/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::These shipped migrations were modified, deleted or renamed:"
            echo "$changed"
            echo "::error::Add a new numbered migration (next free version) instead. Editing a shipped one breaks startup for existing users."
            exit 1
          fi
          echo "No shipped migration changed."

  frontend:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: vitest pulls in undici 8, whose decompression interceptor
          # binds zlib.createZstdDecompress at import time. That function only
          # exists from Node 22.10, so on 20 every worker dies before a single
          # test file is read.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test

  backend:
    name: Unit tests (cargo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib
