name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Neither job needs more than the checkout. CodeQL flagged the missing block:
# the default GITHUB_TOKEN is far broader than a test run requires.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: vitest pulls in undici 8, whose decompression interceptor
          # binds zlib.createZstdDecompress at import time. That function only
          # exists from Node 22.10, so on 20 every worker dies before a single
          # test file is read.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test

  backend:
    name: Unit tests (cargo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib
